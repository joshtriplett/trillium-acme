[package]
name = "trillium-acme"
version = "0.3.0"
authors = ["Josh Triplett <josh@joshtriplett.org>"]
edition = "2021"
description = "Automatic HTTPS certificates for trillium.rs, via Let's Encrypt and ACME tls-alpn-01 challenges"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshtriplett/trillium-acme"
keywords = ["trillium", "acme", "autocert", "https", "tls"]
categories = ["web-programming::http-server", "web-programming"]

[features]
# Use aws-lc by default to match rustls, rustls-acme, and trillium
default = ["aws-lc-rs"]
aws-lc-rs = ["rustls-acme/aws-lc-rs"]
ring = ["rustls-acme/ring"]
webpki-roots = ["rustls-acme/webpki-roots"]

[dependencies]
futures-lite = "2.6.1"
rustls-acme = { version = "0.15.3", default-features = false }
trillium = "1.3"
trillium-server-common = "0.7"

[dev-dependencies]
anyhow = "1.0.102"
rustls-pki-types = "1.14.1"
smol = "2.0.2"
tempfile = "3.27.0"
trillium-acme = { path = ".", features = ["webpki-roots"] }
trillium-client = "0.9"
trillium-quinn = "0.1.4"
trillium-rustls = { version = "0.11", default-features = false, features = ["aws-lc-rs", "client"] }
trillium-smol = "0.6"
